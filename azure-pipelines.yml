# Unit-тести симулятора (не потребують Tesseract і Chrome).
# https://docs.microsoft.com/azure/devops/pipelines/languages/python

trigger:
- main

pool:
 name: default #agent pool
 demands:
 - agent.name -equals DESKTOP-7ELQFO1 #self-hosted agent

strategy:
  matrix:
    Python310:
      python.version: '3.10'
    Python311:
      python.version: '3.11'
    Python312:
      python.version: '3.12'
    Python313:
      python.version: '3.13'

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '$(python.version)'
  displayName: 'Use Python $(python.version)'

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt -r requirements-dev.txt
    pip install pytest-azurepipelines
  displayName: 'Install dependencies'

- script: |
    python -m pytest
  displayName: 'pytest'

# Приклад порогу якості для перевірки реального сайту (потребує Tesseract і Chrome
# на агенті): збірка впаде з кодом 1, якщо ILR будь-якої симуляції > 30%.
